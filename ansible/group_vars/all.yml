---
# One version for every Elastic component: Elasticsearch, Logstash and Kibana on elk, Filebeat on web.
elastic_stack_version: "9.5.4"

# Stack passwords are generated by Terraform into Key Vault (key_vault_name comes from the generated inventory),
# so every machine that runs this playbook uses the same ones. site.yml reads them once with the Azure CLI's login.
# Key Vault secret => the variable the roles use. Secret names must match local.stack_passwords in
# terraform/envs/dev/locals.tf.
stack_password_secrets:
  elastic-password: elk_elastic_password
  kibana-system-password: elk_kibana_system_password
  logstash-internal-password: elk_logstash_writer_password
