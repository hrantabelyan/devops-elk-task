---
- name: Add the Elastic APT repository
  ansible.builtin.import_role:
    name: elastic_repo

- name: Install certificate tooling
  ansible.builtin.apt:
    name: python3-cryptography
    state: present

- name: Install Elasticsearch, Kibana and Logstash
  ansible.builtin.apt:
    name:
      - "elasticsearch={{ elk_version }}"
      - "kibana={{ elk_version }}"
      - "logstash=1:{{ elk_version }}-1"
    state: present
    update_cache: true

- name: Hold stack packages at the installed version
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - elasticsearch
    - kibana
    - logstash

- name: Raise vm.max_map_count for Elasticsearch
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "1048576"
    sysctl_file: /etc/sysctl.d/60-elasticsearch.conf
    state: present
    reload: true
