---
# Ports come from the Terraform-generated inventory (local.ports), so vhosts match the NSG rules.
apache_http_port: "{{ http_port | default(80) }}"
apache_https_port: "{{ https_port | default(443) }}"

apache_server_name: "{{ inventory_hostname }}"
apache_document_root: /var/www/html

# Let's Encrypt certificate for the public IP, requested and renewed by certbot on the server itself.
# IP certificates need the shortlived profile: valid for 160 hours, about 6.7 days.
apache_certbot_profile: shortlived
apache_certbot_webroot: /var/www/acme
# Leave empty to register without an address, or set one to get expiry warnings from Let's Encrypt.
apache_certbot_email: ""
# certbot keeps the certificate under this name and reuses it on renewal.
apache_certbot_cert_name: "{{ inventory_hostname }}"
apache_certbot_dir: "/etc/letsencrypt/live/{{ apache_certbot_cert_name }}"
# The HTTPS vhost serves these, so it is enabled only once they exist.
apache_certbot_certificate: "{{ apache_certbot_dir }}/fullchain.pem"
apache_certbot_private_key: "{{ apache_certbot_dir }}/privkey.pem"
# 5.4 is the first certbot whose webroot plugin can validate an IP address.
apache_certbot_minimum_version: "5.4"
# The snap ships this timer, which renews the certificate without Ansible.
apache_certbot_renew_timer: snap.certbot.renew.timer
# Extra certbot arguments, e.g. ["--test-cert"] to use the staging environment while testing.
apache_certbot_extra_args: []
