---
- name: Create ACME account directory
  ansible.builtin.file:
    path: "{{ apache_acme_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Generate ACME account key
  community.crypto.openssl_privatekey:
    path: "{{ apache_acme_account_key }}"
    type: ECC
    curve: secp256r1
    owner: root
    group: root
    mode: "0600"

- name: Register ACME account
  community.crypto.acme_account:
    acme_directory: "{{ apache_acme_directory }}"
    account_key_src: "{{ apache_acme_account_key }}"
    state: present
    terms_agreed: "{{ apache_acme_terms_agreed | bool }}"
    contact: "{{ apache_acme_contact }}"

- name: Create TLS directory
  ansible.builtin.file:
    path: "{{ apache_tls_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Generate TLS private key
  community.crypto.openssl_privatekey:
    path: "{{ apache_tls_private_key }}"
    owner: root
    group: root
    mode: "0600"

- name: Check for an existing Let's Encrypt certificate
  ansible.builtin.stat:
    path: "{{ apache_acme_certificate }}"
  register: apache_acme_certificate_file

- name: Read the existing Let's Encrypt certificate
  community.crypto.x509_certificate_info:
    path: "{{ apache_acme_certificate }}"
    valid_at:
      renewal: "{{ apache_acme_renew_before }}"
  register: apache_acme_certificate_info
  when: apache_acme_certificate_file.stat.exists

# Issue when forced, missing, close to expiry, or issued for a different IP.
- name: Decide whether to issue a certificate
  ansible.builtin.set_fact:
    apache_acme_issue: >-
      {{ apache_acme_force | bool
         or not apache_acme_certificate_file.stat.exists
         or not apache_acme_certificate_info.valid_at.renewal
         or apache_acme_certificate_info.subject_alt_name != ['IP:' ~ ansible_host] }}

- name: Issue Let's Encrypt certificate for the public IP
  when: apache_acme_issue | bool
  block:
    # Let's Encrypt only issues for public IPs, so the CSR holds the public IP and nothing else.
    - name: Build certificate signing request for the public IP
      community.crypto.openssl_csr_pipe:
        privatekey_path: "{{ apache_tls_private_key }}"
        subject_alt_name:
          - "IP:{{ ansible_host }}"
      register: apache_acme_csr

    - name: Create ACME order
      community.crypto.acme_certificate_order_create:
        acme_directory: "{{ apache_acme_directory }}"
        account_key_src: "{{ apache_acme_account_key }}"
        csr_content: "{{ apache_acme_csr.csr }}"
        profile: "{{ apache_acme_profile }}"
      register: apache_acme_order

    - name: Publish http-01 challenge responses
      ansible.builtin.copy:
        dest: "{{ apache_acme_webroot }}/{{ item.challenges['http-01'].resource }}"
        content: "{{ item.challenges['http-01'].resource_value }}"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ apache_acme_order.challenge_data }}"
      loop_control:
        label: "{{ item.identifier }}"
      when: "'http-01' in item.challenges"

    - name: Let Let's Encrypt validate the challenges
      community.crypto.acme_certificate_order_validate:
        acme_directory: "{{ apache_acme_directory }}"
        account_key_src: "{{ apache_acme_account_key }}"
        order_uri: "{{ apache_acme_order.order_uri }}"
        challenge: http-01

    - name: Download the certificate
      community.crypto.acme_certificate_order_finalize:
        acme_directory: "{{ apache_acme_directory }}"
        account_key_src: "{{ apache_acme_account_key }}"
        csr_content: "{{ apache_acme_csr.csr }}"
        order_uri: "{{ apache_acme_order.order_uri }}"
        fullchain_dest: "{{ apache_acme_certificate }}"
      notify: Reload Apache

  always:
    - name: Remove http-01 challenge responses
      ansible.builtin.file:
        path: "{{ apache_acme_webroot }}/{{ item.challenges['http-01'].resource }}"
        state: absent
      loop: "{{ apache_acme_order.challenge_data | default([]) }}"
      loop_control:
        label: "{{ item.identifier }}"
      when: "'http-01' in item.challenges"
